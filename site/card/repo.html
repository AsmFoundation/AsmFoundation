<!doctype html>
<!--
  The source of the repositories' social previews: the card GitHub hands to X, LinkedIn, Slack and the rest
  when someone shares a link to one of the organization's repositories. One family, in the drafts the owner
  approved on 2026-11-26: the logo, the repository's name as the headline, one line, the address.

  Not published and not read by the build. GitHub has no API for the upload: each PNG is uploaded by hand in
  the repository's Settings > General > Social preview. Render one card per repository, from the
  repository root (the query string picks it; the PNG name must match what was uploaded):

    chrome --headless=new --hide-scrollbars --allow-file-access-from-files --virtual-time-budget=3000
           --force-device-scale-factor=2 --window-size=1200,630
           --screenshot=site/card/repos/KvAsm.png "file:///<absolute path>/site/card/repo.html?r=KvAsm"

  - --allow-file-access-from-files is required, or Chrome refuses the @font-face files from a file:// page.
  - 2400x1260 (1200x630 at 2x): the 1.91:1 frame X draws, sharp on high-density screens, and about 100 KB,
    well under GitHub's 1 MB limit for a social preview.
  - An unknown name renders "?" as the headline, so a typo in the query shows in the render.
  - X lays the shared page's title over the bottom-left corner, so the address sits bottom-right.
-->
<html lang="en"><head><meta charset="utf-8">
<style>
  @font-face { font-family: "Archivo"; src: url("../assets/fonts/archivo-latin.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
  @font-face { font-family: "Martian Mono"; src: url("../assets/fonts/martian-mono-latin.woff2") format("woff2"); font-weight: 100 800; }
  html, body { margin: 0; background: #fff; }
  /* White paper and ink; the logo's mint and teal only as marks (the site's rule). */
  .card { position: relative; width: 1200px; height: 630px; overflow: hidden; background: #fff;
    font-family: "Archivo", system-ui, sans-serif; color: #22292c; -webkit-font-smoothing: antialiased; }
  .logo-a .m { fill: #3eea8c; } .logo-a .t { fill: #06706d; }
  .brand { position: absolute; left: 72px; top: 70px; display: flex; align-items: center; gap: 16px; font-weight: 800;
    font-stretch: 116%; letter-spacing: -.01em; color: #062f2e; font-size: 30px; }
  h1 { position: absolute; left: 68px; top: 170px; margin: 0; font-weight: 800; font-stretch: 116%; letter-spacing: -.03em;
    color: #062f2e; font-size: 128px; line-height: 1; white-space: nowrap; }
  .bar { position: absolute; left: 72px; top: 306px; width: 96px; height: 8px; background: #3eea8c; }
  p { position: absolute; left: 72px; top: 330px; width: 900px; margin: 0; font-size: 34px; line-height: 1.36; color: #5b656b; }
  .addr { position: absolute; right: 72px; bottom: 62px; font: 500 21px "Martian Mono", monospace; color: #5b656b; }
</style></head>
<body>
<div class="card">
  <div class="brand"><svg class="logo-a" viewBox="236 204 782 746" width="44" height="42" aria-hidden="true"><rect class="m" x="559" y="214" width="135" height="135"/><rect class="m" x="414" y="372" width="129" height="125"/><rect class="m" x="559" y="372" width="135" height="125"/><rect class="m" x="712" y="372" width="127" height="125"/><rect class="t" x="349" y="524" width="138" height="121"/><rect class="t" x="766" y="524" width="138" height="121"/><rect class="t" x="288" y="665" width="139" height="124"/><rect class="t" x="451" y="665" width="351" height="121"/><rect class="t" x="826" y="665" width="139" height="124"/><rect class="t" x="246" y="811" width="156" height="129"/><rect class="t" x="850" y="811" width="158" height="129"/></svg>AsmFoundation</div>
  <h1 id="name">?</h1>
  <div class="bar"></div>
  <p id="line"></p>
  <div class="addr" id="addr"></div>
</div>
<script>
  // One line per repository, as the owner approved them (the foundation CLAUDE.md's repository table, in the
  // site's wording). Keep a line true to what the repository holds: a card outlives the moment it was made.
  var repos = {
    KvAsm: "A gRPC key-value server, hand-written in x86-64 assembly.",
    AsmSdk: "Assembly projects on MSBuild and NuGet: x64, ARM64 and WebAssembly.",
    GrpcAsm: "A gRPC server and client in x86-64 assembly.",
    HttpAsm: "HTTP/1.1, /2 and /3 in assembly, written from the RFCs.",
    AsmClaudeMarketplace: "Claude Code plugins for assembly projects.",
    AsmFoundation: "Free Open Source Assembly Software: the website and the benchmarks."
  };
  var r = new URLSearchParams(location.search).get("r") || "";
  if (Object.prototype.hasOwnProperty.call(repos, r)) {
    document.getElementById("name").textContent = r;
    document.getElementById("line").textContent = repos[r];
    document.getElementById("addr").textContent = "github.com/AsmFoundation/" + r;
    // A long name (AsmClaudeMarketplace) must still fit the 1056 px between the margins: shrink the headline
    // 4 px at a time until it does, rather than guessing a size per name. The floor of 48 px ends the loop
    // for a name that could never fit (it then overflows visibly in the render instead of hanging).
    // Measure only once Archivo has loaded: the font files load asynchronously from file://, and a loop run
    // at parse time measures the narrower fallback font, so the name fit then and overflowed once Archivo
    // arrived (the first render of AsmClaudeMarketplace did exactly that). Headless Chrome's
    // --virtual-time-budget waits for this promise before the screenshot.
    var h = document.getElementById("name");
    document.fonts.load("800 128px Archivo").then(function () {
      var size = 128;
      h.style.fontSize = size + "px";
      while (h.scrollWidth > 1056 && size > 48) { size -= 4; h.style.fontSize = size + "px"; }
    });
  }
</script>
</body></html>
