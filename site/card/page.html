<!doctype html>
<!--
  The template of the per-page link-preview cards (site/assets/cards/<page>.png): the page's name over the block
  the page leads with, captured from the built page itself. The owner picked a card for each of the six pages
  (Projects, Docs, Benchmarks, Architecture, Get started, About) on 2026-11-26, rendered by hand; Home keeps
  "The listing" (card.html).

  Not opened by hand: site/card/pages.cs fills it (?t=<the page's name>&img=<file URL of the captured block>) and
  renders it at 1200x630, 2x, for every page. Read pages.cs's header for the command.
  - The block is scaled down to fit under the name, never up, and anchored top-left: it is a page's opening, so
    its first lines matter most.
  - X lays the shared page's title over the bottom-left corner: whatever the block shows there is covered.
  - Fonts load from ../assets/fonts by file:// address, which Chrome allows only with --allow-file-access-from-files
    (pages.cs passes it).
-->
<html lang="en"><head><meta charset="utf-8">
<style>
  @font-face { font-family: "Archivo"; src: url("../assets/fonts/archivo-latin.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
  html, body { margin: 0; background: #fff; }
  .card { position: relative; width: 1200px; height: 630px; overflow: hidden; background: #fff;
    font-family: "Archivo", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .logo-a .m { fill: #3eea8c; } .logo-a .t { fill: #06706d; }
  .brand { position: absolute; left: 72px; top: 56px; display: flex; align-items: center; gap: 14px; font-weight: 800;
    font-stretch: 116%; letter-spacing: -.01em; color: #062f2e; font-size: 26px; }
  h1 { position: absolute; left: 72px; top: 104px; margin: 0; font-weight: 800; font-stretch: 116%; letter-spacing: -.024em;
    color: #062f2e; font-size: 64px; line-height: 1; }
  /* the captured block: scaled to fit, never enlarged (a capture is already at 2x) */
  .shot { position: absolute; left: 40px; right: 40px; top: 196px; bottom: 28px; display: flex; justify-content: center; align-items: flex-start; }
  .shot img { max-width: 100%; max-height: 100%; }
</style></head>
<body>
<div class="card">
  <div class="brand"><svg class="logo-a" viewBox="236 204 782 746" width="36" height="34" aria-hidden="true"><rect class="m" x="559" y="214" width="135" height="135"/><rect class="m" x="414" y="372" width="129" height="125"/><rect class="m" x="559" y="372" width="135" height="125"/><rect class="m" x="712" y="372" width="127" height="125"/><rect class="t" x="349" y="524" width="138" height="121"/><rect class="t" x="766" y="524" width="138" height="121"/><rect class="t" x="288" y="665" width="139" height="124"/><rect class="t" x="451" y="665" width="351" height="121"/><rect class="t" x="826" y="665" width="139" height="124"/><rect class="t" x="246" y="811" width="156" height="129"/><rect class="t" x="850" y="811" width="158" height="129"/></svg>AsmFoundation</div>
  <h1 id="t"></h1>
  <div class="shot"><img id="i" alt=""></div>
</div>
<script>
  // pages.cs passes the page's name and the captured block; it waits for the image to decode before rendering.
  var q = new URLSearchParams(location.search);
  document.getElementById("t").textContent = q.get("t") || "?";
  if (q.get("img")) document.getElementById("i").src = q.get("img");
</script>
</body></html>
